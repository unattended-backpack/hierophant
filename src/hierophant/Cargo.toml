[package]
name = "hierophant"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
network-lib = { path = "../network-lib" }
tonic = { version = "0.12.0", features = ["transport"] }
prost = "0.13.4"
hyper = { version = "0.14", features = ["full"] }
log.workspace = true
hex.workspace = true
sha2.workspace = true
alloy-primitives.workspace = true
anyhow.workspace = true
uuid = { version = "1.0", features = ["v4", "serde"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
toml.workspace = true
bincode.workspace = true
sp1-sdk = { workspace = true, features = ["native-gnark"] }
sp1-prover.workspace = true
zstd.workspace = true
risc0-zkvm.workspace = true
# OpenVM verification happens in the spawned openvm-worker subprocess
# (see src/openvm-worker); only the socket protocol is linked here,
# keeping openvm-sdk's upstream p3-* pins out of this binary's graph so
# sp1-sdk 6.5+ can live in it.
openvm-worker-proto = { path = "../openvm-worker-proto" }
env_logger.workspace = true
reqwest.workspace = true
futures-util.workspace = true
clap.workspace = true

[build-dependencies]
tonic-build = "0.10.0"
