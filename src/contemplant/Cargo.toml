[package]
name = "contemplant"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
alloy-primitives = { workspace = true, features = ["getrandom"] }
reqwest.workspace = true
lazy_static = "1.4"
rand = "0.9.1"
regex = "1"
futures-util.workspace = true
tokio-tungstenite.workspace = true
sp1-sdk.workspace = true
risc0-zkvm.workspace = true
openvm-sdk.workspace = true
openvm-sdk-config.workspace = true
openvm-stark-sdk.workspace = true
bitcode.workspace = true
sha2.workspace = true
network-lib = { path = "../network-lib" }
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
bincode.workspace = true
log.workspace = true
base64.workspace = true
tracing-appender = "0.2.3"
tracing-subscriber.workspace = true
tracing.workspace = true
clap.workspace = true

[features]
enable-native-gnark = ["sp1-sdk/native-gnark"]
enable-risc0-cuda = ["risc0-zkvm/cuda"]
# Links openvm-sdk's CUDA backend (GpuSdk) into the binary. Same deploy-time
# caveats as enable-risc0-cuda: requires a CUDA runtime at load time.
enable-openvm-cuda = ["openvm-sdk/cuda"]
# Links the halo2/snark-verifier stack needed to produce OpenVM EVM proofs.
# Off by default because it is a large compile-time addition; required for
# `evm_enabled = true` on an openvm [[provers]] entry.
enable-openvm-evm = ["openvm-sdk/evm-prove"]
