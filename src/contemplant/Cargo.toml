[package]
name = "contemplant"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
alloy-primitives = { workspace = true, features = ["getrandom"] }
reqwest.workspace = true
lazy_static = "1.4"
rand = "0.9.1"
regex = "1"
futures-util.workspace = true
tokio-tungstenite.workspace = true
sp1-sdk.workspace = true
risc0-zkvm.workspace = true
# OpenVM proving happens in the spawned openvm-worker subprocess (see
# src/openvm-worker); only the socket protocol is linked here, keeping
# openvm-sdk's upstream p3-* pins out of this binary's graph so sp1-sdk
# 6.5+ can live in it.
openvm-worker-proto = { path = "../openvm-worker-proto" }
sha2.workspace = true
network-lib = { path = "../network-lib" }
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
bincode.workspace = true
log.workspace = true
base64.workspace = true
tracing-appender = "0.2.3"
tracing-subscriber.workspace = true
tracing.workspace = true
clap.workspace = true
# SP1 progress: sp1-cuda spawns sp1-gpu-server with inherited stderr, so we
# tap our own stderr (dup2) to parse the server's progress lines.
libc = "0.2"

[features]
enable-native-gnark = ["sp1-sdk/native-gnark"]
enable-risc0-cuda = ["risc0-zkvm/cuda"]
# The former enable-openvm-cuda / enable-openvm-evm features moved to
# the openvm-worker crate (its own workspace) with the same names; build
# the worker with them instead of this binary.
