[workspace]
members = [
  "src/hierophant",
  "src/contemplant",
  "src/network-lib",
  "src/fibonacci",
]
exclude = ["src/sp1-fibonacci", "src/risc0-fibonacci", "src/openvm-fibonacci"]
resolver = "2"

[workspace.package]
license = "LicenseRef-VPL WITH AGPL-3.0-only"
authors = ["Joss Duff <jossduff.eth>", "Tim Clancy <tim-clancy.eth>"]
edition = "2024"

[workspace.dependencies]
sha2 = "0.10.8"
tokio-tungstenite = "0.24.0"
axum = { version = "0.7.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
	"std",
] }
toml = "0.8.20"
env_logger = "0.11.8"
anyhow = { version = "1.0.86", default-features = false }
tokio = { version = "1.40.0", features = ["full"] }
dotenv = "0.15.0"
log = "0.4.22"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.198", features = ["derive"] }
serde_json = { version = "1.0.117", default-features = false }
hex = "0.4.3"
bincode = "1.3.3"
base64 = "0.22.1"
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }
# `serde` was enabled transitively by sp1-sdk 5.x; sp1-sdk 6.x's
# alloy-primitives dep is optional (behind its `network` feature), so name the
# feature here rather than relying on unification for our own B256 fields.
alloy-primitives = { version = "1.0.0", default-features = false, features = [
	"sha3-keccak",
	"getrandom",
	"serde",
] }
clap = "4.5.41"
# =6.2.1, deliberately NOT 6.2.2+: slop-air >=6.2.2 pins p3-air
# =0.4.3-succinct, which cargo cannot unify with the upstream p3-air =0.4.3
# that openvm v2.0.1 pins (same 0.4 compatibility bucket, different bytes).
# slop 6.2.1 rides p3 ^0.3.3-succinct - a different 0.x minor - so the SP1
# and OpenVM stacks coexist in one binary. Guests built with the v6.2.2
# toolchain prove fine against a 6.2.x-family network (same
# within-family skew as the prior 5.0.8-guest / 5.0.4-network pairing).
# Revisit when openvm releases against plonky3 0.5+.
# sp1-sdk 6.x ships with `default = []`: the network client/proto stack and
# the sp1-cuda client are opt-in features now, where 5.x always built them.
# `network` names the proto modules hierophant's server mirrors and that
# network-lib's shared types embed; `cuda` is the contemplant's GPU prover
# (a pure-Rust client that drives a local `sp1-gpu-server` binary; no CUDA
# toolchain is needed at build time).
sp1-sdk = { version = "=6.2.1", features = ["network", "cuda"] }
# Names the circuit-artifact directory helpers (groth16/plonk dirs) that
# sp1-sdk 6.x stopped re-exporting from `sp1_sdk::install`. Same exact pin as
# sp1-sdk's own dep so cargo unifies both into one package instance.
sp1-prover = { version = "=6.2.1" }
# sp1-sdk 6.x clients zstd-compress artifact uploads (stdin, ELF) before the
# presigned-URL PUT; hierophant decompresses on read. Same 0.13 req as the
# sdk's own dep so the two unify.
zstd = "0.13"
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove", "client"] }
# OpenVM is not published on crates.io (only 0.0.0-reserved placeholders); it
# is consumed as a git dependency pinned to a release tag, per upstream docs.
# default-features drops `jemalloc`: openvm-stark-backend's jemalloc feature
# registers a #[global_allocator], which we must not inherit into binaries
# that also link the SP1 + RISC Zero stacks. `parallel` keeps rayon proving.
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.1", default-features = false, features = ["parallel"] }
# Same tag as openvm-sdk; these name types openvm-sdk does not re-export:
# SdkVmConfig (config parsing), CommitBytes (commit hex comparison), and
# VmStarkProof (aggregated proof decoding).
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.1", default-features = false }
openvm-continuations = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.1", default-features = false }
openvm-verify-stark-host = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.1", default-features = false }
# Lives in the separate stark-backend repo; MUST stay on the exact tag the
# openvm workspace pins (see openvm's root Cargo.toml for the release) so
# cargo unifies it with openvm-sdk's copy into one package instance; OpenVM
# v2.0.1 still pins stark-backend v2.0.0, so this tag intentionally lags the
# openvm.git tags above. Names the system-params helpers and the
# proving/verifying key types that openvm-sdk uses but does not re-export.
openvm-stark-sdk = { version = "2.0.0", git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.0", default-features = false }
# App-proof wire format: openvm v2 persists app proofs as bitcode (its
# `.app.proof` files); pinned to the exact version openvm's workspace pins so
# the encodings stay byte-identical.
bitcode = { version = "0.6.5", default-features = false, features = ["serde"] }
