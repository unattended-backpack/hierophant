[workspace]
members = [
  "src/hierophant",
  "src/contemplant",
  "src/network-lib",
  "src/fibonacci",
  "src/openvm-worker-proto",
]
# openvm-worker is excluded ON PURPOSE: it is the quarantine workspace
# that links openvm-sdk (upstream p3-air =0.4.3) so this workspace can
# link sp1-sdk 6.5+ (slop's p3-air =0.4.3-succinct); the two exact pins
# cannot share one lockfile. The hierophant and contemplant talk to it
# through src/openvm-worker-proto over a unix socket.
exclude = [
  "src/sp1-fibonacci",
  "src/risc0-fibonacci",
  "src/openvm-fibonacci",
  "src/openvm-worker",
]
resolver = "2"

[workspace.package]
license = "LicenseRef-VPL WITH AGPL-3.0-only"
authors = ["Joss Duff <jossduff.eth>", "Tim Clancy <tim-clancy.eth>"]
edition = "2024"

[workspace.dependencies]
sha2 = "0.10.8"
tokio-tungstenite = "0.24.0"
axum = { version = "0.7.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
	"std",
] }
toml = "0.8.20"
env_logger = "0.11.8"
anyhow = { version = "1.0.86", default-features = false }
tokio = { version = "1.40.0", features = ["full"] }
dotenv = "0.15.0"
log = "0.4.22"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.198", features = ["derive"] }
serde_json = { version = "1.0.117", default-features = false }
hex = "0.4.3"
bincode = "1.3.3"
base64 = "0.22.1"
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }
# `serde` was enabled transitively by sp1-sdk 5.x; sp1-sdk 6.x's
# alloy-primitives dep is optional (behind its `network` feature), so name the
# feature here rather than relying on unification for our own B256 fields.
alloy-primitives = { version = "1.0.0", default-features = false, features = [
	"sha3-keccak",
	"getrandom",
	"serde",
] }
clap = "4.5.41"
# 6.6.0 across the whole workspace since the openvm-worker split
# (2026-09-02). History: slop-air >=6.2.2 pins p3-air =0.4.3-succinct,
# which cargo cannot unify with the upstream p3-air =0.4.3 that openvm
# pins (v2.0.2 included; same 0.4 bucket, different bytes), so this
# workspace was held at =6.2.1 (whose slop rode p3 ^0.3.3-succinct, a
# different minor). The conflict is now resolved STRUCTURALLY: openvm-sdk
# lives only in the excluded src/openvm-worker workspace (its own
# lockfile), reached over a unix socket, so nothing here links the
# upstream p3 pins and sp1 can track current releases. The program vkey
# is fixed by the circuit version (v6.1.0), verified byte-identical
# across 6.2.1/6.5.0 for the deployed guests.
# sp1-sdk 6.x ships with `default = []`: the network client/proto stack and
# the sp1-cuda client are opt-in features now, where 5.x always built them.
# `network` names the proto modules hierophant's server mirrors and that
# network-lib's shared types embed; `cuda` is the contemplant's GPU prover
# (a pure-Rust client that drives a local `sp1-gpu-server` binary; no CUDA
# toolchain is needed at build time).
sp1-sdk = { version = "=6.6.0", features = ["network", "cuda"] }
# Names the circuit-artifact directory helpers (groth16/plonk dirs) that
# sp1-sdk 6.x stopped re-exporting from `sp1_sdk::install`. Same exact pin as
# sp1-sdk's own dep so cargo unifies both into one package instance.
sp1-prover = { version = "=6.6.0" }
# sp1-sdk 6.x clients zstd-compress artifact uploads (stdin, ELF) before the
# presigned-URL PUT; hierophant decompresses on read. Same 0.13 req as the
# sdk's own dep so the two unify.
zstd = "0.13"
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove", "client"] }
# The openvm-sdk stack (and bitcode, its app-proof wire format) lives
# ONLY in the excluded src/openvm-worker workspace since the 6.5 split;
# see the exclude note at the top of this file. Nothing in this
# workspace may link openvm-sdk: that reintroduces the upstream p3-air
# exact pin and breaks the sp1 6.5 resolution.
